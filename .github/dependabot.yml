# Dependabot version updates.
# Commit messages follow Conventional Commits (chore(deps): ...).
# Minor and patch updates are grouped to keep PR noise low.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: ci
      include: scope
    labels: ["dependencies", "area: ci"]
    groups:
      actions:
        patterns: ["*"]

  # The hash-pinned tools CI installs with pip (pre-commit and its dependencies).
  # The cooldown keeps the rule of taking only releases at least two weeks old.
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
      include: scope
    labels: ["dependencies", "area: ci"]
    groups:
      ci-tools:
        patterns: ["*"]

